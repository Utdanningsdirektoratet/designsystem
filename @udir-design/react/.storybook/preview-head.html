<!--
  Pin CSS @layer precedence order explicitly.

  In Storybook we hand-assemble the CSS: the designsystemet layers (`ds.*`) load
  via `.storybook/style.css`, while the Udir component layers (`udir.components`)
  load per-component from each component's `.tsx`. That makes the final layer
  precedence depend on the bundler's module ordering. Declaring the parent-layer
  order here locks `udir` above `ds` regardless of how the bundler orders the
  emitted CSS.

  Without this, some bundler versions (e.g. rolldown >=1.2.0, used by Vite 8.2.x)
  hoist the `udir.components` block above the `ds.*` layers, which makes
  designsystemet defaults override our customizations.
-->
<style>
  @layer ds, udir;
</style>
<link
  rel="preload stylesheet"
  as="style"
  href="https://altinncdn.no/fonts/inter/v4/inter.css"
/>
<script>
  document.documentElement.lang = 'nb';

  // Forward ⌘K / Ctrl+K to the manager frame so Pagefind's modal opens
  // instead of Storybook's "Find components"
  document.addEventListener(
    'keydown',
    (e) => {
      if (e.key === 'k' && (e.metaKey || e.ctrlKey)) {
        e.preventDefault();
        e.stopPropagation();
        window.parent.postMessage('pagefind:open', window.location.origin);
      }
    },
    { capture: true },
  );
</script>
<!--
  Storybook names the page after the story id as it selects a story, and a
  screen reader reads every new title: "components bindestrek fileupload
  bindestrek bindestrek …" before the name `withDocumentTitle` gives it. Leave
  out that step, so the page goes straight from "Storybook" to the story's name.
-->
<script>
  (() => {
    const title = Object.getOwnPropertyDescriptor(Document.prototype, 'title');
    Object.defineProperty(document, 'title', {
      configurable: true,
      get() {
        return title.get.call(this);
      },
      set(value) {
        if (value === new URLSearchParams(location.search).get('id')) return;
        title.set.call(this, value);
      },
    });
  })();
</script>
