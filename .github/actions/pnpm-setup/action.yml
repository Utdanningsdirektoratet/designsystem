name: Prepare pnpm & CI caches
description: Installs pnpm, sets up the pnpm + Turborepo caches, and configures SCM base for affected detection
inputs:
  registry-url:
    description: |
      Optional registry to set up for auth. Will set the registry in a project level
      .npmrc and .yarnrc file, and set up auth to read in from env.NODE_AUTH_TOKEN.
    default: ''
  playwright-deps:
    description: |
      Install Playwright's Chromium system dependencies once for this runner.
      Enable in jobs that run browser tests. The per-package `pretest` scripts
      only download the browser binary, which Playwright serialises with its own
      lockfile; the apt-get half has no such lock, so it must run exactly once.
    default: 'false'

runs:
  using: 'composite'
  steps:
    # Note: pnpm version is set in package.json "packageManager"
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    # Cache node_modules
    # Note: node version is set in package.json "devEngines.runtime"
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: 'package.json'
        cache: 'pnpm'
        registry-url: ${{ inputs.registry-url }}

    - run: pnpm install
      shell: bash

    # Runs on its own, with no sibling tasks competing for the dpkg lock. The
    # lock timeout covers the runner image's own background apt activity.
    - name: Install Playwright system dependencies
      if: inputs.playwright-deps == 'true'
      shell: bash
      run: |
        echo 'DPkg::Lock::Timeout "120";' | sudo tee /etc/apt/apt.conf.d/99lock-timeout
        pnpm exec playwright install-deps chromium

    # Turborepo remote cache via GitHub Actions cache.
    # The key includes the job name so parallel/sequential jobs don't overwrite each other.
    # The restore-keys fall back progressively: same job first, then any job on the same OS,
    # so e.g. storybook-tests can reuse build results cached by the main job.
    - name: Cache Turborepo
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ github.job }}-
          turbo-${{ runner.os }}-

    # Set Turborepo SCM base for affected detection.
    # For PRs: compare against the PR target branch (e.g. "origin/main").
    # For pushes: compare against the previous branch HEAD before the push,
    #   so turbo can identify which packages were affected by the new commits.
    #   Falls back to ref_name if github.event.before is unavailable or is the
    #   zero SHA (initial branch creation).
    - name: Set TURBO_SCM_BASE
      shell: bash
      run: |
        if [[ "${{ github.event_name }}" == "push" ]]; then
          BEFORE="${{ github.event.before }}"
          if [[ -n "$BEFORE" && "$BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            echo "TURBO_SCM_BASE=$BEFORE" >> "$GITHUB_ENV"
          else
            echo "TURBO_SCM_BASE=origin/${{ github.ref_name }}" >> "$GITHUB_ENV"
          fi
        else
          echo "TURBO_SCM_BASE=origin/${{ github.base_ref || github.ref_name }}" >> "$GITHUB_ENV"
        fi
