<!doctype html>
<html lang="{{language}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Informasjonskapsler</title>
    <link
      rel="preload stylesheet"
      as="style"
      href="https://altinncdn.no/fonts/inter/v4/inter.css"
    />
    <!-- Local preview dependencies. These are not part of Cookie Information's HTML Code. -->
    <link rel="stylesheet" href="/css/theme/dist/index.css" />
    <link rel="stylesheet" href="/css/digdir/dist/src/index.css" />
    <link rel="stylesheet" href="/css/udir/dist/components.css" />
    <link rel="stylesheet" href="/css/udir/dist/icons.css" />
    <link rel="stylesheet" href="/template/css-code.css" />
    <style>
      body {
        margin: 0;
      }
      .cookie-preview-content {
        min-block-size: calc(100vh - 4.25rem - var(--ds-size-10) * 2);
      }
    </style>
  </head>
  <body>
    <!-- Local Cookie Information API stub. This is not part of Cookie Information's JavaScript Code. -->
    <script id="CookieConsent" data-culture="{{culture}}">
      window.CookieInformation = {
        submitAllCategories: function () {
          hideCookieBanner();
        },
        submitConsent: function () {
          hideCookieBanner();
        },
        declineAllCategories: function () {
          hideCookieBanner();
        },
        changeCategoryConsentDecision: function (name) {
          console.log('Toggle:', name);
        },
        getConsentGivenFor: function () {
          return false;
        },
      };
      window.CookieConsent = {
        renew: function () {
          showCookieBanner();
        },
      };
      window.addEventListener('load', function () {
        showCookieBanner();
      });
    </script>

    {{{cookieTemplate}}}

    <!-- Simulated consumer page content. This is not part of Cookie Information's template. -->
    <div class="cookie-preview-content" aria-hidden="true"></div>

    <!-- Consumer-owned link for reopening the consent dialog. -->
    <footer class="uds-footer">
      <div>
        <ul class="uds-footer__list">
          <li>
            <a
              class="ds-link"
              href="#informasjonskapsler"
              data-testid="coi-banner__renew-consent-link"
              onclick="
                renewCookieConsent();
                return false;
              "
            >
              {{cookie_settings_link_text}}
            </a>
          </li>
        </ul>
      </div>
    </footer>

    <script src="/template/javascript-code.js"></script>
  </body>
</html>
